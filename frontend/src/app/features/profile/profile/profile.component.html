<div class="max-w-md mx-auto mt-10 mb-10 p-6 bg-white shadow-lg rounded-xl border">

  <h2 class="text-2xl font-semibold mb-6 text-gray-800">
    My Profile
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        Email
      </label>
      <input
        type="email"
        [value]="user?.email"
        disabled
        class="w-full px-3 py-2 border rounded bg-gray-100 text-gray-600 cursor-not-allowed"
      />
    </div>

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        Name
      </label>
      <input
        type="text"
        formControlName="name"
        placeholder="Enter your name"
        class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-purple-500 focus:outline-none"
      />
    </div>

    <!-- Phone -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        Phone
      </label>
      <input
        type="text"
        formControlName="phone"
        placeholder="Enter phone number"
        class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-purple-500 focus:outline-none"
      />
    </div>

    <!-- Save Button -->
    <button
      type="submit"
      [disabled]="form.invalid || loading"
      class="w-full flex items-center justify-center gap-2 bg-purple-600 hover:bg-purple-700 disabled:bg-purple-300 text-white py-2 rounded transition"
    >
      <span *ngIf="!loading">Save Changes</span>
      <span *ngIf="loading">Saving...</span>
    </button>

  </form>
</div>
