<div class="bg-[#F5F6FA] min-h-screen px-4 sm:px-6 md:px-[140px] py-8">
  <h2 class="text-3xl font-bold text-center mb-6 text-[#272136]">
    My Wishlist
  </h2>

  <div *ngIf="wishlist.length === 0" class="text-center text-gray-500">
    No products in your wishlist yet.
  </div>

  <div class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3">
    <div
      *ngFor="let item of wishlist"
      class="bg-white rounded-xl shadow-md hover:shadow-lg transition flex flex-col cursor-pointer relative"
      (click)="viewDetails(item.productId)"
    >

      <!-- REMOVE HEART -->
      <button
        class="absolute top-3 right-3 z-20 w-9 h-9 flex items-center justify-center rounded-full backdrop-blur-md shadow-md hover:scale-110 transition"
       (click)="removeFromWishlist(item.productId, $event)"
      >
        <i class="fa-solid fa-heart text-lg text-white"></i>
      </button>

      <!-- IMAGE -->
      <div class="overflow-hidden rounded-t-xl">
        <img
          [src]="item.imageUrl"
          alt="{{ item.productName }}"
          class="w-full h-56 object-cover"
        />
      </div>

      <!-- CONTENT -->
      <div class="p-4">
        <h3 class="text-lg font-semibold text-[#272136] line-clamp-2">
          {{ item.productName }}
        </h3>
        <p class="text-[#7C3AED] font-bold text-lg mt-2">
          ₹{{ item.price }}
        </p>
        <div class="px-4 pb-4">
  <button
    class="w-full mt-2 bg-[#7C3AED] text-white py-2 rounded-lg hover:opacity-90 transition"
    (click)="moveToCart(item, $event)"
  >
    Move to Cart
  </button>
</div>


      </div>

    </div>
  </div>
</div>
