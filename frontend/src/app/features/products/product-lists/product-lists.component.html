<div class="bg-[#F5F6FA] min-h-screen px-4 sm:px-6 md:px-[140px] py-8">
  <h2 class="text-3xl font-bold text-center mb-6 text-[#272136]">All Products</h2>

  <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
    <div class="relative w-full md:w-1/2">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input
        type="text"
        placeholder="Search for products"
        [(ngModel)]="searchTerm"
        (input)="searchProducts()"
        class="w-full pl-11 pr-5 py-3 rounded-full border border-gray-200 bg-gradient-to-r from-white to-gray-50 text-gray-700 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-[#a477f1]"
      />
    </div>

    <label for="filterToggle"
      class="ml-4 mb-1 flex items-center gap-2 bg-[#8a69dd] text-white px-4 py-2.5 rounded-lg shadow cursor-pointer">
      <i class="fa-solid fa-filter"></i> Filters
    </label>
  </div>

  <input type="checkbox" id="filterToggle" class="hidden peer" />

  <!-- FILTER PANEL -->
<div class="fixed top-20 right-0 w-[360px] h-[calc(100vh-5rem)]
            bg-white rounded-l-2xl shadow-2xl z-50
            transform translate-x-full peer-checked:translate-x-0
            transition-transform duration-300">


  <div class="p-6 flex flex-col gap-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-4">
      <h3 class="text-xl font-bold text-gray-800">Filters</h3>
      <label for="filterToggle" class="cursor-pointer text-2xl text-gray-400 hover:text-gray-700">
        &times;
      </label>
    </div>

   <!-- SORT -->
<div>
  <p class="text-xs font-semibold text-gray-400 uppercase mb-2">
    Sort by
  </p>

  <div class="flex flex-col gap-1">
    <button
      type="button"
      (click)="sortOption='priceLow'; applyFilters()"
      class="text-left px-4 py-2 rounded-md text-sm transition"
      [class.bg-[#F3E8FF]]="sortOption==='priceLow'"
      [class.text-[#6D28D9]]="sortOption==='priceLow'"
    >
      Price: Low → High
    </button>

    <button
      type="button"
      (click)="sortOption='priceHigh'; applyFilters()"
      class="text-left px-4 py-2 rounded-md text-sm transition"
      [class.bg-[#F3E8FF]]="sortOption==='priceHigh'"
      [class.text-[#6D28D9]]="sortOption==='priceHigh'"
    >
      Price: High → Low
    </button>
  </div>
</div>


   <!-- CATEGORY -->
<div class="flex flex-col flex-grow">
  <p class="text-xs font-semibold text-gray-400 uppercase mb-3">
    Category
  </p>

  <div class="grid grid-cols-2 gap-2 overflow-y-auto pr-1">
    
    <!-- ALL -->
    <button
      type="button"
      (click)="categoryId=null; applyFilters()"
      class="px-3 py-2 rounded-lg text-sm font-medium transition
             border border-gray-200"
      [class.bg-[#7C3AED]]="categoryId===null"
      [class.text-white]="categoryId===null"
    >
      All
    </button>

    <!-- CATEGORY ITEMS -->
    <button
      *ngFor="let c of categories"
      type="button"
      (click)="categoryId=c.id; applyFilters()"
      class="px-3 py-2 rounded-lg text-sm font-medium transition
             border border-gray-200"
      [class.bg-[#7C3AED]]="categoryId===c.id"
      [class.text-white]="categoryId===c.id"
    >
      {{ c.name | titlecase }}
    </button>

  </div>
</div>


    <!-- ACTIONS -->
    <div class="pt-4 border-t flex gap-3">
      <button
        (click)="clearFilters()"
        class="w-full border border-gray-300 text-gray-700 py-2 rounded-lg
               font-medium hover:bg-gray-100 transition">
        Clear
      </button>

      <label for="filterToggle"
        class="w-full text-center bg-[#7C3AED] text-white py-2 rounded-lg
               font-medium cursor-pointer hover:bg-[#5B21B6] transition">
        Apply
      </label>
    </div>

  </div>
</div>

  <!-- PRODUCT GRID -->
<div class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3">
  <div
    *ngFor="let product of products"
    class="bg-white rounded-xl shadow-md hover:shadow-lg transition
           flex flex-col cursor-pointer relative"
    style="height: 420px;"
    (click)="viewDetails(product.id)"
  >

    <!-- WISHLIST  -->
    <button
      class="absolute top-3 right-3 z-20 w-9 h-9 flex items-center
             justify-center rounded-full backdrop-blur-md shadow-md
             hover:scale-110 transition"
      (click)="toggleVisualList(product); $event.stopPropagation()"
    >
      <i
        class="fa-heart text-lg transition-colors duration-300"
        [class.fa-solid]="wishlistService.isInWishlist(product.id)"
        [class.fa-regular]="!wishlistService.isInWishlist(product.id)"
        [class.text-white]="wishlistService.isInWishlist(product.id)"
        [class.text-gray-800]="!wishlistService.isInWishlist(product.id)"
      ></i>
    </button>

    <!-- IMAGE -->
    <div class="overflow-hidden rounded-t-xl flex-shrink-0">
      <img
        [src]="product.imageUrls?.[0]"
        alt="{{ product.name }}"
        class="w-full h-56 object-cover"
      />
    </div>

    <div class="p-4 flex flex-col justify-between flex-grow">
      <div>
        <h3 class="text-[15.5px] font-medium text-gray-800 leading-snug line-clamp-2">
  {{ product.name }}
</h3>

<p class="text-[12px] uppercase tracking-wider text-gray-400 mt-1">
  {{ product.categoryName }}
</p>

<p class="text-[18px] font-semibold text-black mt-2">
  ₹{{ product.price }}
</p>

      </div>

      <!-- ADD TO CART -->
      <button
        class="mt-4 w-full bg-[#8a69dd] text-white py-2 rounded-lg
               font-medium hover:bg-[#5B21B6] transition"
        (click)="addToCart(product); $event.stopPropagation()"
      >
        Add to Cart
      </button>
    </div>

  </div>
</div>


  <!-- PAGINATION -->
  <div class="flex justify-center items-center gap-4 mt-10">
    <button
      (click)="prevPage()"
      [disabled]="pageNumber === 1"
      class="bg-[#7C3AED] text-white px-4 py-2 rounded-lg">
      Previous
    </button>

    <span class="font-semibold">
     Page {{ pageNumber }} of {{ totalPages }}

    </span>

    <button
      (click)="nextPage()"
      [disabled]="pageNumber * pageSize >= totalCount"
      class="bg-[#7C3AED] text-white px-4 py-2 rounded-lg">
      Next
    </button>
  </div>
</div>
