<section class="max-w-5xl mx-auto py-10 px-5">
  <h2 class="text-2xl font-bold mb-5">My Orders</h2>

  <div *ngIf="orders.length === 0" class="text-gray-500 text-center">
    No orders found.
  </div>

  <div *ngFor="let order of orders"
       class="bg-white shadow rounded-lg p-5 mb-6 border border-gray-200">

    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-2 mb-3">
      <p class="font-semibold">Order ID: {{ order.id }}</p>

      <span class="text-sm font-semibold"
            [ngClass]="{
              'text-blue-500': order.status === 'Pending',
              'text-purple-600': order.status === 'Paid',
              'text-yellow-500': order.status === 'Shipped' || order.status === 'OutForDelivery',
              'text-green-600': order.status === 'Delivered',
              'text-red-500': order.status === 'Cancelled'
            }">
        {{ getDisplayStatus(order) }}
      </span>
    </div>

    <!-- ITEMS -->
    <div class="space-y-2 mb-4">
      <div *ngFor="let item of order.items"
           class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <img [src]="item.image" class="w-12 h-12 rounded" />
          <p>{{ item.name }} × {{ item.quantity }}</p>
        </div>
        <p class="font-medium">₹{{ item.price * item.quantity }}</p>
      </div>
    </div>

    <!-- TRACKING -->
<div *ngIf="order.status !== 'Cancelled'" class="mt-6">
  <h4 class="font-semibold mb-4">Order Tracking</h4>

  <div class="relative">

    <!-- background line -->
    <div class="absolute top-4 left-0 right-0 h-1 bg-gray-300 rounded"></div>

    <!-- progress line -->
    <div
      class="absolute top-4 left-0 h-1 bg-purple-600 rounded transition-all duration-500"
      [style.width.%]="getProgress(order)">
    </div>

    <!-- steps -->
    <div class="grid grid-cols-4 relative z-10">
      <ng-container *ngFor="let step of trackingSteps; let i = index">
        <div class="flex flex-col items-center">
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold"
            [ngClass]="{
              'bg-purple-600': isStepCompleted(order, step),
              'bg-gray-300': !isStepCompleted(order, step)
            }">
            {{ i + 1 }}
          </div>
          <p class="text-xs mt-2 text-center">{{ step }}</p>
        </div>
      </ng-container>
    </div>

  </div>
</div>


    <!-- FOOTER -->
    <div class="flex justify-between items-center mt-6 pt-3 border-t">
      <p class="font-semibold">Total: ₹{{ order.total }}</p>

      <button *ngIf="order.status === 'Pending'"
              (click)="cancelOrder(order)"
              class="px-4 py-1 bg-red-500 text-white rounded hover:bg-red-600">
        Cancel
      </button>
    </div>

  </div>
</section>
