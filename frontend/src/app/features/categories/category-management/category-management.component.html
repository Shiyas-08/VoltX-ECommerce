<div class="max-w-6xl mx-auto">

  <div class="mb-6">
    <h2 class="text-2xl font-semibold text-gray-800">Category Management</h2>
  </div>
     
  
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
    <form (ngSubmit)="submit()" class="flex flex-col md:flex-row gap-4 items-end">

      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Category Name
        </label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Enter category name"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
          required
        />
      </div>

      <div class="flex gap-2">
        <button
          type="submit"
          class="px-5 py-2 bg-purple-700 text-white rounded-lg hover:bg-purple-600 transition font-medium"
        >
          {{ editId ? 'Update' : 'Add' }}
        </button>

        <button
          type="button"
          (click)="reset()"
          class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition font-medium"
        >
          Clear
        </button>
      </div>

    </form>
  </div>

  <!-- Category Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

    <table class="min-w-full text-sm">
      <thead class="bg-gray-50 border-b">
        <tr>
          <th class="px-6 py-3 text-left font-semibold text-gray-600">ID</th>
          <th class="px-6 py-3 text-left font-semibold text-gray-600">Name</th>
          <th class="px-6 py-3 text-left font-semibold text-gray-600">Status</th>
          <th class="px-6 py-3 text-right font-semibold text-gray-600">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y">

        <tr *ngFor="let c of categories" class="hover:bg-gray-50 transition">
          <td class="px-6 py-4 text-gray-500 font-mono">
            {{ c.id }}
          </td>

          <td class="px-6 py-4 font-medium text-gray-800 capitalize">
            {{ c.name }}
          </td>

          <td class="px-6 py-4">
            <span
              class="px-3 py-1 rounded-full text-xs font-semibold"
              [ngClass]="{
                'bg-green-100 text-green-700': c.isActive,
                'bg-red-100 text-red-700': !c.isActive
              }"
            >
              {{ c.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="px-6 py-4 text-right space-x-2">
            <button
              (click)="edit(c)"
              class="px-3 py-1.5 text-sm bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition"
            >
              Edit
            </button>

            <button
              (click)="toggle(c.id)"
              class="px-3 py-1.5 text-sm rounded-lg transition"
              [ngClass]="{
                'bg-red-100 text-red-700 hover:bg-red-200': c.isActive,
                'bg-green-100 text-green-700 hover:bg-green-200': !c.isActive
              }"
            >
              {{ c.isActive ? 'Deactivate' : 'Activate' }}
            </button>
          </td>
        </tr>

        <tr *ngIf="categories.length === 0">
          <td colspan="4" class="px-6 py-8 text-center text-gray-400">
            No categories found
          </td>
        </tr>

      </tbody>
    </table>

  </div>

</div>
