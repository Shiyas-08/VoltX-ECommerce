<div class="flex flex-col md:flex-row items-center justify-center
            sm:p-[30px] md:p-[60px]
            bg-[#F9F8FF] min-h-screen">

  <div class="flex flex-col md:flex-row
              w-full max-w-[800px] h-[465px]
              rounded-2xl overflow-hidden shadow-2xl">

    <div class="hidden md:flex md:w-1/2 bg-[#C8BAE6]">
      <img
        src="../../../assets/login-IMG/login-img.png"
        alt="Reset Password"
        class="w-full h-full object-cover"
      />
    </div>

    
    <div class="w-full md:w-1/2 flex justify-center items-center bg-white p-6">
      <div class="w-full max-w-md">

        <h2 class="text-2xl font-bold text-center text-[#272136] mb-3">
          Reset Password
        </h2>

        <p class="text-sm text-gray-500 text-center mb-6">
          Create a new password
        </p>

        <form
          [formGroup]="form"
          (ngSubmit)="submit()"
          class="space-y-5">

          <div>
            <label class="block text-gray-700 text-sm mb-1">
              New Password
            </label>
            <input
              type="password"
              formControlName="password"
              placeholder="New password"
              class="w-full px-3 py-2 border rounded-lg
                     focus:ring-2 focus:ring-[#C8BAE6]
                     outline-none"
            />
          </div>

          <div>
            <label class="block text-gray-700 text-sm mb-1">
              Confirm Password
            </label>
            <input
              type="password"
              formControlName="confirm"
              placeholder="Confirm password"
              class="w-full px-3 py-2 border rounded-lg
                     focus:ring-2 focus:ring-[#C8BAE6]
                     outline-none"
            />
          </div>

          <button
            type="submit"
            [disabled]="loading"
            class="w-full bg-[#7f5ebe] hover:bg-[#7550b4]
                   text-white font-semibold py-2
                   rounded-lg shadow transition duration-300
                   disabled:opacity-50"
          >
            {{ loading ? 'Resetting...' : 'Reset Password' }}
          </button>

        </form>
      </div>
    </div>

  </div>
</div>
