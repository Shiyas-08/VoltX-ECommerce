<div
  class="flex flex-col md:flex-row items-center justify-center 
         sm:p-[30px] md:p-[60px] bg-[#F9F8FF] min-h-screen"
>
  <div
    class="flex flex-col md:flex-row w-full max-w-[800px] h-[465px] 
           rounded-2xl overflow-hidden shadow-2xl"
  >

    
    <div class="hidden md:flex md:w-1/2 bg-[#C8BAE6]">
      <img
        src="../../../assets/login-IMG/login-img.png"
        alt="Forgot Password"
        class="w-full h-full object-cover"
      />
    </div>

    
    <div class="w-full md:w-1/2 flex justify-center items-center bg-white p-6">
      <div class="w-full max-w-md">

        <h2 class="text-2xl font-bold text-center text-[#272136] mb-2">
          Forgot Password
        </h2>

        <p class="text-sm text-center text-gray-500 mb-6">
          Enter your registered email to receive OTP
        </p>

        <form
          [formGroup]="form"
          (ngSubmit)="submit()"
          class="space-y-6"
        >

          
          <div>
            <label class="block text-gray-700 text-sm mb-1">
              Email
            </label>
            <input
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              class="w-full px-3 py-2 border rounded-lg 
                     focus:ring-2 focus:ring-[#C8BAE6] 
                     outline-none"
            />
          </div>

       
          <button
            type="submit"
            [disabled]="loading"
            class="w-full bg-[#7f5ebe] hover:bg-[#7550b4] 
                   text-white font-semibold py-2 
                   rounded-lg shadow transition duration-300
                   disabled:opacity-50"
          >
            {{ loading ? 'Sending OTP...' : 'Send OTP' }}
          </button>

        
          <p class="text-center text-gray-600 mt-3 text-sm">
            Remember password?
            <a
              routerLink="/auth/login"
              class="text-[#544380] font-semibold hover:underline"
            >
              Login
            </a>
          </p>

        </form>

      </div>
    </div>
  </div>
</div>
